# Perfil "prod": ajustes para quando a API for publicada de verdade.
#
# Como ligar (a ordem importa: o último perfil vence, então "prod" vem depois de "mysql"):
#   SPRING_PROFILES_ACTIVE=mysql,prod
#
# Variáveis de ambiente OBRIGATÓRIAS no servidor (nunca no código):
#   JWT_SECRET      chave própria do servidor (Base64, 32 bytes ou mais; gere uma só para produção)
#   MAIL_HOST, MAIL_PORT, MAIL_USER, MAIL_SENHA, MAIL_REMETENTE
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN (se a sala do Meet estiver ligada)
#   MAIL_REDIRECIONAR_PARA deve ficar VAZIA (se existir, todo e-mail vai para esse endereço)
#
# A API precisa ficar atrás de HTTPS (por exemplo, um proxy reverso com certificado). O token viaja no cabeçalho.

# Sem documentação pública da API
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# O banco só é conferido, nunca alterado sozinho: mudanças de tabela entram por script (db/atualizar-mysql.sql)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Respostas de erro sem mensagem interna nem pilha de execução
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Atrás de um proxy HTTPS: o Spring passa a enxergar o endereço e o esquema (https) reais,
# o que também liga o cabeçalho HSTS do Spring Security
server.forward-headers-strategy=framework

# Se a API NÃO estiver atrás de proxy (exposta direto), mude para false: assim ninguém forja o IP no cabeçalho X-Forwarded-For
app.proxy.confiavel=${PROXY_CONFIAVEL:true}
