spring.application.name=api
server.servlet.context-path=/techmentor/api

# Perfil ativo: "mysql" (padrão) ou "h2" (banco em memória, sem instalar nada).
# Para trocar sem editar este arquivo: --spring.profiles.active=h2  ou  variável SPRING_PROFILES_ACTIVE=h2
spring.profiles.active=mysql

spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.pasta-fotos=fotos

# E-mail (recuperar senha). Os valores vêm de variáveis de ambiente, para a senha NÃO ir para o GitHub.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_SENHA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.remetente=${MAIL_REMETENTE:nao-responda@techmentor.com}