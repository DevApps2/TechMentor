# Perfil "h2": banco em memória. Zera a cada reinicialização e já sobe com a carga do data.sql.
spring.datasource.url=jdbc:h2:mem:techmentor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria as tabelas e só depois o data.sql é executado.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
