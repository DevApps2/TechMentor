# Datasource exclusivo dos testes: banco em memória, separado do MySQL local.
spring.datasource.url=jdbc:h2:mem:techmentor-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Os testes não dependem da carga do data.sql.
spring.sql.init.mode=always
# Sem o relógio de lembretes nos testes
app.lembretes.ativo=false

# Este arquivo esconde o application.properties principal durante os testes. Sem estas linhas não existe
# JavaMailSender e o EmailService (recuperação de senha, aviso de denúncia) não consegue ser criado.
# Nenhum e-mail é enviado nos testes.
spring.mail.host=localhost
spring.mail.port=2525
app.mail.remetente=teste@techmentor.test
