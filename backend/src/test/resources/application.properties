# Datasource exclusivo dos testes: banco em memória, separado do MySQL local.
spring.datasource.url=jdbc:h2:mem:techmentor-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Imprime todo SQL no console. Desligado por padrão (o relógio de lembretes e a atualização automática
# das telas fazem dezenas de consultas por minuto). Para depurar: variável de ambiente SQL_VISIVEL=true

# Os testes não dependem da carga do data.sql (só o SeedDataTest a carrega, num banco próprio).
spring.sql.init.mode=never
# Sem o relógio de lembretes nos testes
app.lembretes.ativo=false

# Este arquivo esconde o application.properties principal durante os testes. Sem estas linhas não existe
# JavaMailSender e o EmailService (recuperação de senha, aviso de denúncia) não consegue ser criado.
# Nenhum e-mail é enviado nos testes.
spring.mail.host=localhost
spring.mail.port=2525
app.mail.remetente=teste@techmentor.test


# Chave que assina o token de login (Base64, 32 bytes ou mais). Vem de variável de ambiente: NUNCA escreva a chave aqui.
#security.jwt.secret=${JWT_SECRET}

# Chave fixa pra testes.
security.jwt.secret=Y2hhdmUtc29tZW50ZS1wYXJhLXRlc3Rlcy10ZWNobWVudG9yLW5hby11c2FyLWVtLXByb2R1Y2Fv

# Duração do token de acesso, em milissegundos (15 min)
security.jwt.expiration-ms=900000
